name: Build and Release macOS DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      is_draft:
        description: 'Create Draft Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS DMG & Publish Release
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Xcode Environment
        run: |
          # Use Xcode 15+ installed on macos-14 runner
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          swift --version

      - name: Build EasyIPTV macOS App & .dmg Package
        run: |
          cd swift-sources
          chmod +x build_dmg.sh run_app.command
          ./build_dmg.sh
          ls -lh EasyIPTV-macOS.dmg

      - name: Generate SHA256 Checksum
        run: |
          cd swift-sources
          shasum -a 256 EasyIPTV-macOS.dmg > EasyIPTV-macOS.dmg.sha256
          echo "Generated SHA256 Checksum:"
          cat EasyIPTV-macOS.dmg.sha256

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-$(date +'%Y%m%d%H%M')"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with .dmg Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: EasyIPTV ${{ steps.release_info.outputs.tag }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: false
          generate_release_notes: true
          files: |
            swift-sources/EasyIPTV-macOS.dmg
            swift-sources/EasyIPTV-macOS.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
